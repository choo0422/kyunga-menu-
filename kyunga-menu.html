<style>
  :root{
    --paper:#f2e8d3;
    --paper-card:#fbf6ea;
    --red:#ac3327;
    --red-deep:#7e241b;
    --ink:#241d16;
    --ink-soft:#5c5044;
    --gold:#b8893c;
    --line: rgba(172,51,39,0.28);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 10% 0%, rgba(172,51,39,0.05), transparent 45%),
      radial-gradient(circle at 90% 100%, rgba(184,137,60,0.08), transparent 40%),
      var(--paper);
    font-family:'Noto Sans KR', sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .paper-texture{
    position:fixed; inset:0; pointer-events:none; z-index:0; opacity:0.5;
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 1px, transparent 1px, transparent 3px);
  }
  .wrap{max-width:640px; margin:0 auto; padding:0 0 60px; position:relative; z-index:1;}

  /* ---------- Hero ---------- */
  .hero{
    padding:38px 24px 26px;
    text-align:center;
    position:relative;
  }
  .stamp{
    width:74px; height:74px; margin:0 auto 14px;
    border:2.5px solid var(--red);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color:var(--red);
    font-family:'Noto Serif KR', serif;
    font-weight:900;
    font-size:22px;
    letter-spacing:-1px;
    transform:rotate(-8deg);
    opacity:0;
    animation: stampIn 0.7s cubic-bezier(.2,.9,.3,1.3) 0.15s forwards;
    box-shadow: 0 0 0 1px rgba(172,51,39,0.15) inset;
  }
  @keyframes stampIn{
    0%{opacity:0; transform:rotate(-8deg) scale(2.4);}
    60%{opacity:1;}
    100%{opacity:0.92; transform:rotate(-8deg) scale(1);}
  }
  .hero h1{
    font-family:'Noto Serif KR', serif;
    font-weight:900;
    font-size:34px;
    margin:0 0 4px;
    letter-spacing:1px;
  }
  .hero .sub{
    font-size:13px;
    color:var(--ink-soft);
    letter-spacing:2px;
  }
  .hero .loc{
    margin-top:10px;
    font-size:12px;
    color:var(--gold);
    letter-spacing:1px;
  }

  /* ---------- Language tabs ---------- */
  .langbar{
    position:sticky; top:0; z-index:10;
    background:rgba(242,232,211,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
    padding:10px 16px;
    display:flex; justify-content:center; gap:6px;
  }
  .langtab{
    font-family:'Noto Serif KR', serif;
    font-weight:600;
    font-size:14px;
    padding:8px 16px;
    background:none;
    border:1px solid transparent;
    border-radius:3px;
    color:var(--ink-soft);
    cursor:pointer;
    position:relative;
    transition:color .2s;
  }
  .langtab.active{ color:var(--red); }
  .langtab.active::after{
    content:"";
    position:absolute; left:14px; right:14px; bottom:2px; height:2px;
    background:var(--red);
    border-radius:2px;
  }

  /* ---------- Sections ---------- */
  .section{ padding:30px 20px 6px; opacity:0; transform:translateY(8px); animation:rise .5s ease forwards; }
  .section:nth-of-type(1){animation-delay:.02s}
  .section:nth-of-type(2){animation-delay:.06s}
  .section:nth-of-type(3){animation-delay:.10s}
  .section:nth-of-type(4){animation-delay:.14s}
  .section:nth-of-type(5){animation-delay:.18s}
  .section:nth-of-type(6){animation-delay:.22s}
  @keyframes rise{to{opacity:1; transform:none;}}

  .section-title{
    display:flex; align-items:center; gap:10px;
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:19px;
    color:var(--red-deep);
    margin-bottom:14px;
  }
  .section-title::before, .section-title::after{
    content:""; flex:1; height:1px; background:var(--line);
  }

  .card{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:4px 16px;
    margin-bottom:16px;
  }
  .item{
    display:flex; justify-content:space-between; align-items:flex-start;
    gap:12px;
    padding:13px 0;
    border-bottom:1px dashed rgba(36,29,22,0.12);
  }
  .item:last-child{border-bottom:none;}
  .item-name{
    font-weight:600;
    font-size:15.5px;
    line-height:1.35;
  }
  .item-suffix{
    color:var(--ink-soft);
    font-weight:400;
    font-size:0.82em;
    margin-left:5px;
  }
  .item-note{
    white-space:pre-line;
    display:block;
    font-size:12px;
    color:var(--ink-soft);
    font-weight:400;
    margin-top:3px;
    line-height:1.4;
  }
  .item-price{
    font-variant-numeric:tabular-nums;
    font-weight:700;
    font-size:15px;
    color:var(--red);
    white-space:nowrap;
    padding-top:1px;
  }
  .item-price .was{
    display:block;
    text-align:right;
    font-size:11px;
    font-weight:500;
    color:var(--ink-soft);
    text-decoration:line-through;
    margin-bottom:1px;
  }

  .banner{
    margin:26px 16px 0;
    background:var(--red);
    color:#fbf1e4;
    border-radius:10px;
    padding:16px 18px;
    font-size:12.5px;
    line-height:1.7;
    text-align:center;
  }
  .footnote{
    text-align:center;
    color:var(--ink-soft);
    font-size:12.5px;
    margin:18px 20px 0;
    line-height:1.8;
  }
  .footer-mark{
    text-align:center;
    margin-top:34px;
    font-family:'Noto Serif KR', serif;
    font-size:12px;
    color:var(--gold);
    letter-spacing:3px;
  }
</style>

const NOTICE = {
  ko:'※고기류 주문 시, 찌개 1인 주문가능※',
  en:'※ With a meat order, a single stew can be ordered ※',
  zh:'※点肉类菜品时，可单点1人份火锅 ※',
  ja:'※お肉のご注文でチゲ1人前の追加が可能です ※'
};

const FOOT = {
  ko:'1인 1주문 부탁드립니다 · 평일 점심 공기밥 무한리필',
  en:'One order per person, please · Free rice refills on weekday lunches',
  zh:'每人至少点一份餐 · 平日午餐米饭免费续加',
  ja:'お一人様1品ご注文をお願いします · 平日ランチはご飯おかわり無料'
};

let currentLang = 'ko';

function renderLangbar(){
  const bar = document.getElementById('langbar');
  bar.innerHTML = '';
  LANGS.forEach(l=>{
    const btn = document.createElement('button');
    btn.className = 'langtab' + (l.code===currentLang ? ' active':'');
    btn.textContent = l.label;
    btn.onclick = ()=>{ currentLang = l.code; render(); };
    bar.appendChild(btn);
  });
}

function t(field, lang){
  if(!field) return '';
  return field[lang] || field.ko || '';
}

function render(){
  renderLangbar();

  const u = UI[currentLang];
  document.getElementById('restName').textContent = u.name;
  document.getElementById('restSub').textContent = u.sub;
  document.getElementById('restTagline').textContent = u.tag;

  const root = document.getElementById('menuRoot');
  root.innerHTML = '';

  DATA.forEach(section=>{
    const sec = document.createElement('div');
    sec.className = 'section';

    const h = document.createElement('div');
    h.className = 'section-title';
    h.textContent = t(section.title, currentLang);
    sec.appendChild(h);

    const card = document.createElement('div');
    card.className = 'card';

    section.items.forEach(item=>{
      const row = document.createElement('div');
      row.className = 'item';

      const left = document.createElement('div');
      const nm = document.createElement('div');
      nm.className = 'item-name';
      nm.textContent = t(item.name, currentLang);
      if(item.suffix){
        const sf = document.createElement('span');
        sf.className = 'item-suffix';
        sf.textContent = t(item.suffix, currentLang);
        nm.appendChild(sf);
      }
      left.appendChild(nm);
      if(item.note){
        const nt = document.createElement('span');
        nt.className = 'item-note';
        nt.textContent = t(item.note, currentLang);
        left.appendChild(nt);
      }

      const right = document.createElement('div');
      right.className = 'item-price';
      if(item.was){
        const was = document.createElement('span');
        was.className = 'was';
        was.textContent = currentLang==='ko' ? item.was : (item.wasT ? item.wasT[currentLang] : item.was);
        right.appendChild(was);
      }
      const pr = document.createElement('span');
      pr.textContent = currentLang==='ko' ? item.price : (item.priceT ? item.priceT[currentLang] : item.price);
      right.appendChild(pr);

      row.appendChild(left);
      row.appendChild(right);
      card.appendChild(row);
    });

    sec.appendChild(card);

    if(section.banner){
      const b = document.createElement('div');
      b.className = 'banner';
      b.style.margin = '0 0 16px';
      b.textContent = t(section.banner, currentLang);
      sec.appendChild(b);
    }

    root.appendChild(sec);
  });

  const notice = document.createElement('div');
  notice.className = 'banner';
  notice.textContent = t(NOTICE, currentLang);
  root.appendChild(notice);

  const foot = document.createElement('div');
  foot.className = 'footnote';
  foot.textContent = t(FOOT, currentLang);
  root.appendChild(foot);
}

render();
</script>
</body>
</html>
